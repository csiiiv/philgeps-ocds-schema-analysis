name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Regenerate artifacts (build script must produce clean output)
        run: python scripts/build_schema_field_map.py

      - name: Verify no unintended changes in committed artifacts
        run: |
          # The build is deterministic; regenerating against the committed config
          # should produce no diff. If it does, the artifacts are stale.
          if [ -n "$(git status --porcelain references app/src/data/schema_bundle.json)" ]; then
            echo "::error::Generated artifacts are out of sync with config. Run 'python scripts/build_schema_field_map.py' and commit the result."
            git --no-pager diff --stat references app/src/data/schema_bundle.json
            exit 1
          fi

      - name: Validate sample OCDS release package against OCDS 1.1
        run: python scripts/validate_sample_release.py

  build-webapp:
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install and type-check webapp
        working-directory: app
        run: |
          npm ci
          npm run build
