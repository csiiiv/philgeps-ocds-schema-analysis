# OCDS closed-codelist transforms applied at compile time (Template v0.92 feedback).
# Local PhilGEPS labels → OCDS 1.1 codes.

defaults:
  currency: PHP
  initiation_type: tender
  tag:
    - compiled
  classification_scheme: UNSPSC
  unit_scheme: UNCEFACT

procurement_method:
  # Public Bidding variants → open
  Public Bidding: open
  "Competitive Bidding (Public Bidding)": open
  "National Competitive Bidding": open
  "International Competitive Bidding": open
  "Invitation to Bid (ITB)": open
  "Invitation to Apply for Eligibility and to Bid": open
  # Shopping / small value → limited
  "Request for Quotation (RFQ)": limited
  "Small Value Procurement": limited
  "Negotiated Procurement - Small Value Procurement (Sec. 53.9)": limited
  "Local Purchase": limited
  "Limited Source Bidding (Sec. 49)": limited
  Shopping: limited
  "Shopping - Ordinary/Regular Office Supplies & Equipment (Sec. 52.1.b)": limited
  "Shopping - Unforeseen Contingency (Sec. 52.1.a)": limited
  "Renewal of Regular and Recurring Sevices per Appendix 37": limited
  # Direct / negotiated → direct
  "Notice for Negotiated Procurement": direct
  "Direct Contracting": direct
  "Direct Contracting (Sec. 50)": direct
  "Negotiated Procurement": direct
  "Direct Retail Purchase of POL and Airline Tickets (Sec. 53.14)": direct
  "Negotiated Procurement - Agency to Agency (Sec. 53.5)": direct
  "Negotiated Procurement - Emergency Cases (Sec. 53.2)": direct
  "Negotiated Procurement - Lease of Real Property (Sec. 53.10)": direct
  "Negotiated Procurement - Two Failed Biddings (Sec. 53.1)": direct
  "Negotiated Procurement - Highly Technical Consultants (Sec. 53.7)": direct
  "Negotiated Procurement - Community Participation (Sec. 53.12)": direct
  "Negotiated Procurement - NGO Participation (Sec. 53.11)": direct
  "Negotiated Procurement - Defense Cooperation Agreement (Sec. 53.8)": direct
  "Negotiated Procurement - United Nations Agencies (Sec. 53.13)": direct
  "NP - Scientific, Scholarly/Artistic Work, Exclusive Tech. & Media Service (53.6)": direct

main_procurement_category:
  Goods: goods
  "Goods - General Support Services": goods
  Services: services
  "Consulting Services": services
  "Civil Works": works
  Infrastructure: works

tender_status:
  Active: active
  Closed: complete
  Cancelled: cancelled
  Failed: unsuccessful
  Awarded: complete
  Shortlisted: active

award_status:
  Posted: active
  Updated: active
  Awarded: active
  Active: active
  Cancelled: cancelled
  Failed: unsuccessful

contract_status:
  Posted: active
  Updated: active
  Active: active
  Draft_APR: pending
  Cancelled: cancelled
  Terminated: terminated

bid_status_default: valid
