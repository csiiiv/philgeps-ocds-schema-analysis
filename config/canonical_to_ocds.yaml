# Canonical field → OCDS 1.1 compiled release mapping (draft v0.92).
# Used by scripts/build_schema_field_map.py and downstream OCDS compilers.

version: "0.92-draft"
ocid_prefix: ocds-philgeps

extensions:
  - https://raw.githubusercontent.com/open-contracting-extensions/ocds_bid_extension/master/extension.json
  - https://raw.githubusercontent.com/open-contracting-extensions/ocds_lots_extension/master/extension.json

# Fields generated by the compiler (not read from canonical rows).
generated:
  ocid:
    from:
      - award_reference_no
      - procuring_entity
  release_id: record_id
  release_date:
    prefer:
      - award_published_date
      - published_date
      - award_date

# Planning block included when any of these canonical fields is non-null.
planning_triggers:
  - app_item_id
  - app_total_estimated_budget
  - app_program_title

planning:
  budget/id: app_item_id
  budget/description: funding_source
  budget/amount/amount: app_total_estimated_budget
  budget/amount/currency: _default_currency
  budget/project: app_program_title
  budget/projectID: app_pap_object_code
  rationale: app_remarks

buyer:
  name: procuring_entity
  id: pe_uacs_code

tender:
  id: bid_reference_no
  title: notice_title
  description: item_description
  status: bid_notice_status
  procurementMethod: procurement_mode
  procurementMethodDetails: procurement_mode
  mainProcurementCategory: classification
  value/amount: approved_budget
  value/currency: _default_currency
  tenderPeriod/startDate: published_date
  tenderPeriod/endDate: closing_date
  procuringEntity/name: procuring_entity
  items/id: line_item_no
  items/description: item_description
  items/quantity: quantity
  items/classification/scheme: _default_classification_scheme
  items/classification/id: unspsc_code
  items/classification/description: unspsc_description
  items/unit/name: uom
  items/unit/value/amount: item_budget
  items/unit/value/currency: _default_currency

awards:
  id: award_reference_no
  title: award_title
  date: award_date
  status: award_notice_status
  value/amount: contract_amount
  value/currency: _default_currency
  suppliers/name: awardee_organization_name
  suppliers/id: awardee_org_id
  items/id: line_item_no
  items/description: item_description
  items/quantity: quantity
  items/classification/scheme: _default_classification_scheme
  items/classification/id: unspsc_code
  items/unit/name: uom
  items/unit/value/amount: item_budget
  items/unit/value/currency: _default_currency

contracts:
  id: award_reference_no
  awardID: award_reference_no
  status: award_notice_status
  period/startDate: contract_effectivity_date
  period/endDate: contract_end_date
  value/amount: contract_amount
  value/currency: _default_currency

bids:
  details/tenderers/name: bidders
  details/status: _default_bid_status

# PhilGEPS-specific fields → future registered extension (compile as prefixed keys).
philgeps_extension:
  tradeAgreement: trade_agreement
  fundingInstrument: funding_instrument
  solicitationNo: solicitation_no
  reasonForAward: reason_for_award
  noticeToProceedDate: notice_to_proceed_date
  sourceSchema: source_schema
  sourceFile: source_file
  appStatus: app_status
  prNumber: pr_number
  prStatus: pr_status
  awardeeJointVenture: awardee_joint_venture
